<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Water Level Windows Gantt (Short-Term Predictions History)</title>
    <script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>
    <style>
        /* Bulletproof layout constraints */
        html, body { 
            margin: 0; padding: 0; 
            width: 100vw; height: 100vh; 
            overflow: hidden; 
            background-color: #1a1a1a; 
            font-family: 'Segoe UI', Tahoma, Arial, sans-serif; 
            display: flex;
            flex-direction: column;
        }
        
        /* UI Bar */
        #ui_controls {
            flex: 0 0 auto; 
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            padding: 15px;
            background-color: #222;
            border-bottom: 1px solid #444;
            align-items: center;
            z-index: 20;
        }
        
        #ui_controls select, #ui_controls input[type="date"], #ui_controls button {
            background-color: #333; color: #fff; border: 1px solid #555;
            padding: 8px 12px; border-radius: 4px; font-family: inherit;
            font-size: 14px; outline: none; height: 36px; box-sizing: border-box;
        }

        #ui_controls select:hover, #ui_controls input:hover { border-color: #777; }

        #ui_controls button {
            background-color: #008FFB; border: none; cursor: pointer;
            font-weight: 600; transition: background 0.2s;
        }
        #ui_controls button:hover { background-color: #0076d1; }

        /* Custom Multi-Select */
        .custom-select-wrapper { position: relative; width: 200px; user-select: none; }
        .custom-select-box {
            background-color: #333; color: #fff; border: 1px solid #555;
            padding: 0 12px; border-radius: 4px; font-size: 13px; height: 36px;
            display: flex; align-items: center; justify-content: space-between;
            cursor: pointer; box-sizing: border-box;
        }
        .custom-select-box:hover { border-color: #777; }
        .custom-select-options {
            position: absolute; top: 100%; left: 0; right: 0;
            background-color: #333; border: 1px solid #555; border-top: none;
            border-radius: 0 0 4px 4px; max-height: 300px; overflow-y: auto;
            z-index: 100; display: none; box-shadow: 0 4px 8px rgba(0,0,0,0.3);
        }
        .custom-select-options.open { display: block; }
        .custom-select-options label {
            display: flex; align-items: center; gap: 8px; padding: 8px 12px;
            cursor: pointer; font-size: 13px; color: #ddd; transition: background 0.1s;
        }
        .custom-select-options label:hover { background-color: #444; color: #fff; }
        .custom-select-options input[type="checkbox"] { margin: 0; cursor: pointer; }

        /* The Rocker (Date, Line, & Run) */
        .rocker-group { display: flex; align-items: center; gap: 5px; }
        .rocker-group button { padding: 0 10px; font-size: 12px; background-color: #444; height: 36px; }
        .rocker-group button:hover { background-color: #555; }
        
        /* Checkbox Toggles */
        .checkbox-toggle {
            display: flex; align-items: center; gap: 6px; color: #fff; 
            font-size: 13px; cursor: pointer; user-select: none;
            background-color: #333; padding: 0 12px; height: 36px;
            border: 1px solid #555; border-radius: 4px;
        }
        .checkbox-toggle:hover { border-color: #777; }
        .checkbox-toggle input { margin: 0; cursor: pointer; width: 15px; height: 15px; }

        /* --- 3-TIER CHART ARCHITECTURE --- */
        #top_axis_wrapper {
            flex: 0 0 45px; width: 100%; background-color: #1a1a1a;
            border-bottom: 1px solid #444; z-index: 10;
            overflow-y: scroll; overflow-x: hidden; 
        }
        #chart_wrapper {
            flex: 1 1 auto; width: 100%; background-color: #1a1a1a;
            overflow-y: auto; overflow-x: hidden; position: relative;
        }
        #bottom_axis_wrapper {
            flex: 0 0 45px; width: 100%; background-color: #1a1a1a;
            border-top: 1px solid #444; z-index: 10;
            overflow-y: scroll; overflow-x: hidden; 
        }
        
        #chart_container { width: 100%; }
        
        /* Dark Mode Scrollbars */
        ::-webkit-scrollbar { width: 14px; }
        ::-webkit-scrollbar-track { background: #1a1a1a; border-left: 1px solid #333; }
        ::-webkit-scrollbar-thumb { background: #444; border-radius: 7px; border: 3px solid #1a1a1a; }
        ::-webkit-scrollbar-thumb:hover { background: #555; }
        #top_axis_wrapper::-webkit-scrollbar-thumb, #bottom_axis_wrapper::-webkit-scrollbar-thumb { background: transparent; border: none; }
        #top_axis_wrapper::-webkit-scrollbar-track, #bottom_axis_wrapper::-webkit-scrollbar-track { border-left: transparent; }

        /* Guarantee tooltip stays on top */
        .apexcharts-tooltip {
            z-index: 9999 !important;
        }

    </style>
</head>
<body>
    
    <div id="ui_controls">
        <div class="custom-select-wrapper" id="project-dropdown-wrapper">
            <div class="custom-select-box" onclick="toggleDropdown('filter-project-options')">
                <span id="project-select-text" style="color: #fff;">Loading...</span> <span style="font-size: 10px;">▼</span>
            </div>
            <div class="custom-select-options" id="filter-project-options"></div>
        </div>

        <select id="filter-source"><option value="">All Sources</option></select>
        <select id="filter-datum"><option value="">All Datums</option></select>

        <div class="rocker-group">
            <button onclick="adjustRun(-1)" title="Newer Run Date">&#9664;</button>
            <select id="filter-run"><option value="">All Run Dates</option></select>
            <button onclick="adjustRun(1)" title="Older Run Date">&#9654;</button>
        </div>

        <div class="rocker-group">
            <button onclick="adjustLine(-1)" title="Previous Line">&#9664;</button>
            <div class="custom-select-wrapper" id="line-dropdown-wrapper">
                <div class="custom-select-box" onclick="toggleDropdown('filter-line-options')">
                    <span id="line-select-text">All Lines</span> <span style="font-size: 10px;">▼</span>
                </div>
                <div class="custom-select-options" id="filter-line-options"></div>
            </div>
            <button onclick="adjustLine(1)" title="Next Line">&#9654;</button>
        </div>
        
        <div class="rocker-group">
            <button onclick="adjustDate(-1)" title="Previous Day">&#9664;</button>
            <input type="date" id="filter-date_">
            <button onclick="adjustDate(1)" title="Next Day">&#9654;</button>
        </div>
        
        <select id="filter-synoptic-select" title="Filter runs to synoptic times">
            <option value="none">All Runs</option>
            <option value="all" selected>All Synoptic Runs</option>
            <option value="0">00Z Synoptic Only</option>
            <option value="6">06Z Synoptic Only</option>
            <option value="12">12Z Synoptic Only</option>
            <option value="18">18Z Synoptic Only</option>
        </select>
        
        <label class="checkbox-toggle" title="Toggle between UTC and your computer's Local Time">
            <input type="checkbox" id="filter-time-utc">
            Show in UTC
        </label>

        <button onclick="resetFilters()">Reset Filters</button>
    </div>

    <div id="top_axis_wrapper"><div id="top_axis_container"></div></div>
    <div id="chart_wrapper"><div id="chart_container"></div></div>
    <div id="bottom_axis_wrapper"><div id="bottom_axis_container"></div></div>

    <script type="text/javascript">
        const featureServiceUrl = "https://services2.arcgis.com/C8EMgrsFcRFL6LrL/arcgis/rest/services/rsd_water_level_pred_past/FeatureServer/0/query";
        const apiKey = "AAPTaNsiBCvYe3bQCi9AC9I2_4g..8GrNys8e90CtRvf6r1uaJiGEKAz3_NSqYjaKBOLFQMs3LJ436tQFPU21xwr77EdKMpgjbCMNUubnKailSR4oZ5HtgE4PLLa7iDzwDi5s1MJrKDSQawVNrLBfs6NSmfkhqfrQdKQXsw9ca3xmJ8KJDzGv5e5o76P9HBw1Xng3HIfOWsW9LwuG3l6ZDdpNhRlOHxi7EzRkWzamjQ7nUHADuXuwJ5NnoSREyY9AwbK13oGPD4smNx1bPGQYxhgcZj9QPxZhq6AtAT1_YUBrVuie"; 
        
        let mainChart, topChart, bottomChart;
        let lastUrl = ""; 
        let currentFeatures = []; 

        let tooltipObserver = null;
        function enforceTooltipBounds() {
            const chartWrapper = document.getElementById('chart_wrapper');
            const tooltip = document.querySelector('#chart_container .apexcharts-tooltip');
            if (!chartWrapper || !tooltip || !tooltip.classList.contains('apexcharts-active')) return;

            const minTop = chartWrapper.scrollTop + 10;
            const maxTop = chartWrapper.scrollTop + chartWrapper.clientHeight - tooltip.offsetHeight - 10;
            const minLeft = chartWrapper.scrollLeft + 10;
            const maxLeft = chartWrapper.scrollLeft + chartWrapper.clientWidth - tooltip.offsetWidth - 10;

            let currentTop = parseFloat(tooltip.style.top);
            let currentLeft = parseFloat(tooltip.style.left);
            if (isNaN(currentTop) || isNaN(currentLeft)) return;
            
            let newTop = currentTop;
            let newLeft = currentLeft;

            if (currentTop < minTop) newTop = minTop;
            else if (currentTop > maxTop) newTop = maxTop;

            if (currentLeft < minLeft) newLeft = minLeft;
            else if (currentLeft > maxLeft) newLeft = maxLeft;

            if (newTop !== currentTop || newLeft !== currentLeft) {
                if (tooltipObserver) tooltipObserver.disconnect();
                if (newTop !== currentTop) tooltip.style.top = newTop + 'px';
                if (newLeft !== currentLeft) tooltip.style.left = newLeft + 'px';
                if (tooltipObserver) tooltipObserver.observe(tooltip, { attributes: true, attributeFilter: ['style'] });
            }
        }

        function setupTooltipObserver() {
            if (tooltipObserver) { tooltipObserver.disconnect(); tooltipObserver = null; }
            
            const tooltip = document.querySelector('#chart_container .apexcharts-tooltip');
            if (!tooltip) {
                setTimeout(setupTooltipObserver, 100);
                return;
            }

            tooltipObserver = new MutationObserver(enforceTooltipBounds);
            tooltipObserver.observe(tooltip, { attributes: true, attributeFilter: ['style'] });
        }

        document.getElementById('chart_wrapper').addEventListener('scroll', enforceTooltipBounds);

        function toggleDropdown(id) { document.getElementById(id).classList.toggle('open'); }

        document.addEventListener('click', function(event) {
            document.querySelectorAll('.custom-select-wrapper').forEach(wrapper => {
                if (!wrapper.contains(event.target)) wrapper.querySelector('.custom-select-options').classList.remove('open');
            });
        });

        function updateMultiSelectText(paramName, defaultText) {
            const checkedBoxes = document.querySelectorAll(`.${paramName}-checkbox:checked`);
            const textElement = document.getElementById(`${paramName}-select-text`);
            if (checkedBoxes.length === 0) textElement.innerText = defaultText;
            else if (checkedBoxes.length === 1) textElement.innerText = checkedBoxes[0].value;
            else textElement.innerText = `${checkedBoxes.length} Selected`;
        }

        async function handleMultiSelectChange(paramName) {
            updateMultiSelectText(paramName, paramName === 'project' ? 'All Projects' : 'All Lines');
            const checkedBoxes = document.querySelectorAll(`.${paramName}-checkbox:checked`);
            const selectedVals = Array.from(checkedBoxes).map(cb => cb.value);
            
            const currentUrl = new URL(window.location);
            if (selectedVals.length > 0) currentUrl.searchParams.set(paramName, selectedVals.join(','));
            else currentUrl.searchParams.delete(paramName);
            
            window.history.pushState({}, '', currentUrl);
            if (paramName === 'project') await updateDependentDropdowns();
            fetchWaterLevels();
        }

        function adjustLine(direction) {
            const checkboxes = Array.from(document.querySelectorAll('.line-checkbox'));
            if (checkboxes.length === 0) return; 

            let currentIndex = checkboxes.findIndex(cb => cb.checked);
            
            let newIndex;
            if (currentIndex === -1) {
                newIndex = direction > 0 ? 0 : checkboxes.length - 1;
            } else {
                newIndex = currentIndex + direction;
                if (newIndex < 0) newIndex = checkboxes.length - 1;
                if (newIndex >= checkboxes.length) newIndex = 0;
            }

            checkboxes.forEach(cb => cb.checked = false);
            checkboxes[newIndex].checked = true;

            handleMultiSelectChange('line');
        }

        function adjustRun(direction) {
            const selectEl = document.getElementById('filter-run');
            if (selectEl.options.length <= 1) return; 

            let currentIndex = selectEl.selectedIndex;
            let newIndex = currentIndex + direction;

            if (newIndex < 0) newIndex = selectEl.options.length - 1;
            if (newIndex >= selectEl.options.length) newIndex = 0;

            selectEl.selectedIndex = newIndex;
            
            const currentUrl = new URL(window.location);
            if (selectEl.value) {
                currentUrl.searchParams.set('run', selectEl.value); 
            } else {
                currentUrl.searchParams.delete('run'); 
            }
            window.history.pushState({}, '', currentUrl);
            fetchWaterLevels(); 
        }

        function getTodayString() {
            const today = new Date();
            return `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}-${String(today.getDate()).padStart(2, '0')}`;
        }

        function adjustDate(daysToMove) {
            const dateInput = document.getElementById('filter-date_');
            if (!dateInput.value) return;
            const parts = dateInput.value.split('-');
            const currentDate = new Date(parts[0], parts[1] - 1, parts[2]);
            currentDate.setDate(currentDate.getDate() + daysToMove);
            const newDateStr = `${currentDate.getFullYear()}-${String(currentDate.getMonth() + 1).padStart(2, '0')}-${String(currentDate.getDate()).padStart(2, '0')}`;
            dateInput.value = newDateStr;
            const url = new URL(window.location);
            url.searchParams.set('date_', newDateStr);
            window.history.pushState({}, '', url);
            fetchWaterLevels();
        }

        async function loadOptions(field, dependsOnProjects = false) {
            let sqlWhere = "1=1";
            if (dependsOnProjects) {
                const projs = new URLSearchParams(window.location.search).get('project');
                if (projs && projs !== "null") {
                    const projArray = projs.split(',').map(p => `'${p}'`).join(',');
                    sqlWhere += ` AND project IN (${projArray})`;
                }
            }
            const params = new URLSearchParams({ where: sqlWhere, outFields: field, returnDistinctValues: "true", returnGeometry: "false", f: "json", token: apiKey });
            try {
                const res = await fetch(`${featureServiceUrl}?${params.toString()}`);
                const data = await res.json();
                
                if (data.error) {
                    console.error(`ArcGIS Error loading options for '${field}':`, data.error);
                    if (field === 'project') {
                        const projText = document.getElementById('project-select-text');
                        projText.innerText = "API Error (Check Console)";
                        projText.style.color = "#FF4560";
                    }
                    return;
                }

                if (data.features) {
                    let uniqueVals = [];
                    
                    if (field === 'run') {
                        uniqueVals = [...new Set(data.features.map(f => {
                            const runVal = f.attributes[field];
                            return runVal ? runVal.substring(0, 10) : null;
                        }).filter(v => v))].sort();
                        uniqueVals.reverse(); 
                    } else {
                        uniqueVals = [...new Set(data.features.map(f => f.attributes[field]).filter(v => v))].sort();
                    }

                    if (field === 'project' || field === 'line_name') {
                        const paramName = field === 'line_name' ? 'line' : 'project';
                        const container = document.getElementById(`filter-${paramName}-options`);
                        container.innerHTML = '';
                        uniqueVals.forEach(val => {
                            const lbl = document.createElement('label');
                            lbl.innerHTML = `<input type="checkbox" value="${val}" class="${paramName}-checkbox"> ${val}`;
                            lbl.querySelector('input').addEventListener('change', () => handleMultiSelectChange(paramName));
                            container.appendChild(lbl);
                        });
                        const urlVal = new URL(window.location).searchParams.get(paramName);
                        if (urlVal) {
                            const arr = urlVal.split(',');
                            document.querySelectorAll(`.${paramName}-checkbox`).forEach(cb => cb.checked = arr.includes(cb.value));
                        }
                        updateMultiSelectText(paramName, field === 'project' ? 'All Projects' : 'All Lines');
                    } else {
                        const selectEl = document.getElementById(`filter-${field}`);
                        if (selectEl) {
                            const currentVal = selectEl.value; 
                            while (selectEl.options.length > 1) selectEl.remove(1);
                            
                            uniqueVals.forEach(val => {
                                const opt = document.createElement('option');
                                opt.value = val; opt.textContent = val;
                                selectEl.appendChild(opt);
                            });
                            if (currentVal && uniqueVals.includes(currentVal)) selectEl.value = currentVal;
                            else { selectEl.value = ""; const url = new URL(window.location); url.searchParams.delete(field); window.history.replaceState({}, '', url); }
                        }
                    }
                }
            } catch (e) { console.error(`Failed to load ${field}:`, e); }
        }

        async function updateDependentDropdowns() { 
            await Promise.all([ 
                loadOptions('source', true), 
                loadOptions('datum', true), 
                loadOptions('run', true), 
                loadOptions('line_name', true) 
            ]); 
        }

        async function buildUI() {
            // Load essential options first to determine defaults
            await loadOptions('project', false);
            await loadOptions('run', false); 
            
            const url = new URL(window.location);
            let urlChanged = false;

            // Handle Project Selection
            let currentProjectParam = url.searchParams.get('project');
            if (!currentProjectParam || currentProjectParam === "null") {
                const firstBox = document.querySelector('.project-checkbox');
                if (firstBox) {
                    currentProjectParam = firstBox.value;
                    url.searchParams.set('project', currentProjectParam);
                    urlChanged = true;
                    firstBox.checked = true;
                }
            }

            // Determine what the absolute latest run date is from the loaded dataset
            const runSelect = document.getElementById('filter-run');
            let latestRunDate = getTodayString();
            if (runSelect && runSelect.options.length > 1) {
                // index 0 is "All", index 1 is the highest value due to descending sort
                latestRunDate = runSelect.options[1].value;
            }

            // Default to the latest run date
            let currentRunParam = url.searchParams.get('run');
            if (!url.searchParams.has('run')) { 
                currentRunParam = latestRunDate;
                url.searchParams.set('run', currentRunParam);
                urlChanged = true;
            }

            // Match calendar date to the active run date
            let currentDateParam = url.searchParams.get('date_');
            if (!url.searchParams.has('date_')) {
                currentDateParam = currentRunParam ? currentRunParam.substring(0, 10) : getTodayString();
                url.searchParams.set('date_', currentDateParam);
                urlChanged = true;
            }

            if (urlChanged) window.history.replaceState({}, '', url); 
            
            const projText = document.getElementById('project-select-text').innerText;
            if (!projText.includes("Error")) {
                updateMultiSelectText('project', 'All Projects');
            }

            ['source', 'datum', 'run'].forEach(param => {
                const val = url.searchParams.get(param);
                if (val !== null && val !== "null") {
                    const el = document.getElementById(`filter-${param}`);
                    if (el) el.value = val;
                }
            });

            document.getElementById('filter-date_').value = url.searchParams.get('date_');

            await updateDependentDropdowns();

            document.querySelectorAll('#filter-source, #filter-datum, #filter-run, #filter-date_').forEach(el => {
                el.addEventListener('change', async (e) => {
                    const currentUrl = new URL(window.location);
                    const paramName = e.target.id.replace('filter-', '');
                    if (e.target.value) currentUrl.searchParams.set(paramName, e.target.value); 
                    else currentUrl.searchParams.delete(paramName); 
                    window.history.pushState({}, '', currentUrl);
                    fetchWaterLevels(); 
                });
            });

            document.getElementById('filter-synoptic-select').addEventListener('change', () => {
                if (currentFeatures.length > 0) processAndDraw(currentFeatures, document.getElementById('filter-date_').value);
            });
            document.getElementById('filter-time-utc').addEventListener('change', () => {
                if (currentFeatures.length > 0) processAndDraw(currentFeatures, document.getElementById('filter-date_').value);
            });

            fetchWaterLevels(); 
        }

        function resetFilters() {
            const url = new URL(window.location.origin + window.location.pathname);
            
            // Find latest run date from the dropdown to set as default
            const runSelect = document.getElementById('filter-run');
            let latestRunDate = getTodayString();
            if (runSelect && runSelect.options.length > 1) {
                latestRunDate = runSelect.options[1].value;
            }
            const latestDateOnly = latestRunDate.substring(0, 10);
            
            let firstProj = "";
            const projCheckboxes = document.querySelectorAll('.project-checkbox');
            if (projCheckboxes.length > 0) {
                firstProj = projCheckboxes[0].value;
                url.searchParams.set('project', firstProj);
            }
            
            url.searchParams.set('date_', latestDateOnly);
            url.searchParams.set('run', latestRunDate);
            window.history.pushState({}, '', url);

            document.getElementById('filter-source').value = '';
            document.getElementById('filter-datum').value = '';
            document.getElementById('filter-run').value = latestRunDate;
            document.getElementById('filter-date_').value = latestDateOnly;
            document.getElementById('filter-synoptic-select').value = 'all';
            
            projCheckboxes.forEach((cb, i) => cb.checked = (i === 0));
            document.querySelectorAll('.line-checkbox').forEach(cb => cb.checked = false);
            
            const projText = document.getElementById('project-select-text').innerText;
            if (!projText.includes("Error")) {
                updateMultiSelectText('project', 'All Projects');
            }
            updateMultiSelectText('line', 'All Lines');
            
            updateDependentDropdowns().then(() => fetchWaterLevels());
        }

        function colorizeYAxisText() {
            const labels = document.querySelectorAll('#chart_container .apexcharts-yaxis-label');
            labels.forEach(label => {
                label.setAttribute('text-anchor', 'end');
                label.style.textAnchor = 'end';
                
                const tspans = label.querySelectorAll('tspan');
                const parentX = label.getAttribute('x') || 0;
                
                if (tspans.length === 3) {
                    // Line 1: Project Name
                    tspans[0].setAttribute('fill', '#ffffff'); 
                    tspans[0].style.fill = '#ffffff';
                    tspans[0].style.fontWeight = 'bold';
                    
                    // Line 2: Run Date
                    tspans[1].setAttribute('fill', '#aaaaaa'); 
                    tspans[1].style.fill = '#aaaaaa';
                    tspans[1].style.fontWeight = 'normal';
                    
                    // Line 3: Source | Datum
                    const sText = tspans[2].textContent || "";
                    let sCol = '#ffffff';
                    if (sText.includes('PYDRO')) sCol = '#eb97d8';
                    else if (sText.includes('STOFS')) sCol = '#80ecf0';
                    
                    tspans[2].setAttribute('fill', sCol); 
                    tspans[2].style.fill = sCol;
                    tspans[2].style.fontWeight = 'bold';

                    tspans.forEach((t, i) => {
                        t.setAttribute('text-anchor', 'end'); 
                        t.style.textAnchor = 'end';
                        t.setAttribute('x', parentX);
                        if (i === 0) t.setAttribute('dy', '-0.5em'); 
                        if (i === 1) t.setAttribute('dy', '1.2em');
                        if (i === 2) t.setAttribute('dy', '1.2em');
                    });
                } else {
                    label.setAttribute('fill', '#cccccc'); 
                    label.style.fill = '#cccccc';
                    label.style.fontWeight = 'normal';
                    
                    tspans.forEach(t => {
                        t.setAttribute('fill', '#cccccc'); 
                        t.style.fill = '#cccccc';
                        t.style.fontWeight = 'normal';
                        t.setAttribute('text-anchor', 'end'); 
                        t.style.textAnchor = 'end';
                        t.setAttribute('x', parentX);
                    });
                }
            });
        }

        async function fetchWaterLevels() {
            const currentUrl = window.location.search;
            if (currentUrl === lastUrl && mainChart) return;
            lastUrl = currentUrl;

            const urlParams = new URLSearchParams(currentUrl);
            let sqlWhere = "1=1";
            const filters = ['project', 'datum', 'line_name', 'date_', 'line', 'source', 'run'];
            
            filters.forEach(key => {
                const val = urlParams.get(key);
                if (val && val !== "" && val !== "null") {
                    if (key === 'project') {
                        const arr = val.split(',').map(p => `'${p}'`).join(',');
                        sqlWhere += ` AND project IN (${arr})`;
                    } else if (key === 'line') {
                        const arr = val.split(',').map(l => `'${l}'`).join(',');
                        sqlWhere += ` AND line_name IN (${arr})`;
                    } else if (key === 'run') {
                        sqlWhere += ` AND run LIKE '${val}%'`;
                    } else {
                        sqlWhere += ` AND ${key} = '${val}'`;
                    }
                }
            });

            const params = new URLSearchParams({ where: sqlWhere, outFields: "project,line_name,start,end_,datum,source,run,date_", returnGeometry: "false", f: "json", token: apiKey });

            try {
                const response = await fetch(`${featureServiceUrl}?${params.toString()}`);
                const data = await response.json();
                
                if (data.error) {
                    console.error("ArcGIS Error fetching chart data:", data.error);
                    return; 
                }

                if (data.features) {
                    currentFeatures = data.features;
                    processAndDraw(currentFeatures, urlParams.get('date_'));
                }
            } catch (error) { console.error("Fetch failed:", error); }
        }

        function processAndDraw(features, selectedDate) {
            
            const useUTC = document.getElementById('filter-time-utc') ? document.getElementById('filter-time-utc').checked : false;
            
            let displayFeatures = [...features];

            const synopticSelect = document.getElementById('filter-synoptic-select');
            const synopticVal = synopticSelect ? synopticSelect.value : 'all';

            // Filter valid runs by breaking them down by distinct source
            if (synopticVal !== 'none') {
                const validRuns = new Set();
                const sources = [...new Set(displayFeatures.map(f => (f.attributes.source || 'UNKNOWN').toUpperCase()))];
                
                sources.forEach(src => {
                    const sourceFeatures = displayFeatures.filter(f => (f.attributes.source || '').toUpperCase() === src);
                    
                    const uniqueRuns = [...new Set(sourceFeatures.map(f => f.attributes.run))];
                    
                    const runTimes = uniqueRuns.map(r => {
                        // Force parse as UTC to ensure matching with target synoptic Z times
                        let isoStr = r;
                        if (isoStr && !isoStr.includes('T')) isoStr = isoStr.replace(' ', 'T');
                        if (isoStr && !isoStr.includes('Z') && !isoStr.includes('+') && !isoStr.includes('-')) {
                            isoStr += 'Z'; 
                        }
                        return { run: r, time: new Date(isoStr).getTime() };
                    });
                    
                    const uniqueRunDates = [...new Set(sourceFeatures.map(f => {
                        return f.attributes.run ? f.attributes.run.substring(0, 10) : null;
                    }).filter(v => v))];
                    
                    let targetHours = [];
                    if (synopticVal === 'all') targetHours = [0, 6, 12, 18];
                    else targetHours = [parseInt(synopticVal, 10)];
                    
                    uniqueRunDates.forEach(dateStr => {
                        const targets = targetHours.map(h => new Date(`${dateStr}T${String(h).padStart(2, '0')}:00:00Z`).getTime());
                        
                        targets.forEach(targetTime => {
                            let closestRun = null;
                            let minDiff = Infinity;
                            
                            runTimes.forEach(p => {
                                const diff = Math.abs(p.time - targetTime);
                                if (diff < minDiff && diff <= 4 * 60 * 60 * 1000) { 
                                    minDiff = diff;
                                    closestRun = p.run;
                                }
                            });
                            if (closestRun) validRuns.add(closestRun);
                        });
                    });
                });
                
                displayFeatures = displayFeatures.filter(f => validRuns.has(f.attributes.run));
            }

            const datumColors = { 
                'MLLW': '#FF4F60', 
                'MHW':  '#00B5F7', 
                'BMHW': '#FFAB00'  
            };

            const rawChartData = displayFeatures.map(f => {
                const a = f.attributes;
                const sName = (a.source || 'STOFS').toUpperCase();
                const dType = (a.datum || 'N/A').toUpperCase();
                const projName = a.project || "Unknown Project";
                const rawRun = a.run || "N/A";
                
                let displayRunTime = rawRun;
                if (a.run) {
                    const runD = new Date(a.run);
                    if (!isNaN(runD.getTime())) {
                        const yr = useUTC ? runD.getUTCFullYear() : runD.getFullYear();
                        const mo = String((useUTC ? runD.getUTCMonth() : runD.getMonth()) + 1).padStart(2, '0');
                        const da = String(useUTC ? runD.getUTCDate() : runD.getDate()).padStart(2, '0');
                        const hr = String(useUTC ? runD.getUTCHours() : runD.getHours()).padStart(2, '0');
                        const mi = String(useUTC ? runD.getUTCMinutes() : runD.getMinutes()).padStart(2, '0');
                        const tz = useUTC ? "UTC" : "Local";
                        displayRunTime = `${yr}-${mo}-${da} ${hr}:${mi} ${tz}`;
                    }
                }
                
                return {
                    x: `${projName}|||${displayRunTime}|||${sName}|||${dType}|||${a.line_name}`, 
                    y: [new Date(a.start).getTime(), new Date(a.end_).getTime()],
                    fillColor: datumColors[dType] || '#775DD0',
                    project: projName, 
                    datum: dType, 
                    source: sName, 
                    originalLine: a.line_name, 
                    run: displayRunTime,
                    rawRun: rawRun,
                    isHeader: false
                };
            }).filter(item => !isNaN(item.y[0]) && !isNaN(item.y[1]));

            let xAxisConfig = { type: 'datetime', labels: { datetimeUTC: useUTC }, tickAmount: 24 };
            let minTime = new Date().setHours(0,0,0,0);
            
            if (selectedDate && selectedDate !== "null") {
                const parts = selectedDate.split('-');
                if (useUTC) {
                    minTime = Date.UTC(parts[0], parts[1] - 1, parts[2], 0, 0, 0);
                    xAxisConfig.min = minTime;
                    xAxisConfig.max = Date.UTC(parts[0], parts[1] - 1, parts[2], 23, 59, 59);
                } else {
                    minTime = new Date(parts[0], parts[1] - 1, parts[2], 0, 0, 0).getTime();
                    xAxisConfig.min = minTime;
                    xAxisConfig.max = new Date(parts[0], parts[1] - 1, parts[2], 23, 59, 59).getTime();
                }
            } else if (rawChartData.length > 0) {
                minTime = Math.min(...rawChartData.map(d => d.y[0]));
                xAxisConfig.min = minTime;
                xAxisConfig.max = Math.max(...rawChartData.map(d => d.y[1]));
            }

            const chartData = [...rawChartData];
            const headers = new Set();
            
            rawChartData.forEach(d => {
                const headerKey = `${d.project}|||${d.run}|||${d.source}|||${d.datum}|||__HEADER__`;
                if (!headers.has(headerKey)) {
                    headers.add(headerKey);
                    chartData.push({
                        x: headerKey,
                        y: [minTime, minTime], 
                        fillColor: 'transparent',
                        project: d.project,
                        datum: d.datum,
                        source: d.source,
                        run: d.run,
                        rawRun: d.rawRun, 
                        originalLine: '',
                        isHeader: true
                    });
                }
            });

            chartData.sort((a, b) => {
                if (a.project !== b.project) return a.project.localeCompare(b.project);
                if (a.rawRun && b.rawRun && a.rawRun !== b.rawRun) return b.rawRun.localeCompare(a.rawRun); 
                if (a.source !== b.source) return a.source.localeCompare(b.source);
                if (a.datum !== b.datum) return a.datum.localeCompare(b.datum);
                
                if (a.isHeader && !b.isHeader) return -1;
                if (!a.isHeader && b.isHeader) return 1;
                
                if (a.originalLine !== b.originalLine) return a.originalLine.localeCompare(b.originalLine);
                
                return a.y[0] - b.y[0];
            });

            const uniqueRows = new Set(chartData.map(d => d.x)).size;
            const baseRowHeight = 45; 
            let calculatedHeight = (uniqueRows * baseRowHeight) + 40; 
            
            const wrapperHeight = document.getElementById('chart_wrapper').clientHeight;
            if (calculatedHeight < wrapperHeight) calculatedHeight = wrapperHeight;

            document.getElementById('chart_container').style.height = calculatedHeight + 'px';

            const commonYAxis = { 
                labels: { 
                    minWidth: 160, 
                    maxWidth: 250,
                    align: 'right',
                    offsetX: -5,
                    style: { fontSize: '11px', fontWeight: 500, fontFamily: 'Segoe UI' },
                    formatter: function(val) {
                        if (!val) return "";
                        const parts = String(val).split('|||');
                        if (parts.length === 5) {
                            if (parts[4] === '__HEADER__') {
                                return [parts[0], `Run: ${parts[1]}`, `${parts[2]} | ${parts[3]}`]; 
                            } else {
                                return parts[4]; 
                            }
                        }
                        return val;
                    }
                } 
            };

            const nowTime = new Date().getTime();
            const nowAnnotationLine = { x: nowTime, strokeDashArray: 0, borderColor: '#FF4560', borderWidth: 2 };
            const nowAnnotationLabel = {
                ...nowAnnotationLine,
                label: { style: { color: '#fff', background: '#FF4560', fontSize: '11px', fontWeight: 600, padding: { left: 5, right: 5 } }, text: 'NOW', offsetY: 0 }
            };

            const topOptions = {
                series: [{ data: [{ x: 'Dummy', y: [xAxisConfig.min, xAxisConfig.max] }] }],
                chart: { type: 'rangeBar', height: 60, id: 'top-chart', toolbar: { show: false }, animations: { enabled: false } },
                plotOptions: { bar: { horizontal: true } }, colors: ['transparent'],
                xaxis: { ...xAxisConfig, position: 'top', labels: { style: { colors: '#ccc' }, datetimeUTC: useUTC } },
                yaxis: { labels: { ...commonYAxis.labels, show: true, style: { colors: ['transparent'] } } },
                annotations: { xaxis: [ nowAnnotationLabel ] },
                grid: { show: false, padding: { left: 0, right: 30, top: 0, bottom: -20 } },
                tooltip: { enabled: false }
            };

            const bottomOptions = {
                series: [{ data: [{ x: 'Dummy', y: [xAxisConfig.min, xAxisConfig.max] }] }],
                chart: { type: 'rangeBar', height: 50, id: 'bottom-chart', toolbar: { show: false }, animations: { enabled: false } },
                plotOptions: { bar: { horizontal: true } }, colors: ['transparent'],
                xaxis: { ...xAxisConfig, position: 'bottom', labels: { style: { colors: '#ccc' }, datetimeUTC: useUTC } },
                yaxis: { labels: { ...commonYAxis.labels, show: true, style: { colors: ['transparent'] } } },
                annotations: { xaxis: [ nowAnnotationLine ] },
                grid: { show: false, padding: { left: 0, right: 30, top: -20, bottom: 0 } },
                tooltip: { enabled: false }
            };

            const formatTimeStr = (timestamp) => {
                const d = new Date(timestamp);
                const h = useUTC ? d.getUTCHours() : d.getHours();
                const m = useUTC ? d.getUTCMinutes() : d.getMinutes();
                return String(h).padStart(2, '0') + String(m).padStart(2, '0');
            };

            const mainOptions = {
                series: [{ data: chartData }],
                chart: { 
                    type: 'rangeBar', height: calculatedHeight, id: 'main-chart',
                    toolbar: { show: true, autoSelected: 'pan', tools: { pan: true, zoom: true, zoomin: true, zoomout: true, reset: true, download: false } },
                    events: { mounted: function() { colorizeYAxisText(); }, updated: function() { colorizeYAxisText(); } }
                },
                plotOptions: { bar: { horizontal: true, barHeight: '80%' } }, 
                
                dataLabels: {
                    enabled: true,
                    formatter: function(val, opts) {
                        const d = opts.w.globals.initialSeries[opts.seriesIndex].data[opts.dataPointIndex];
                        if (d.isHeader) return ''; 
                        
                        const sTime = formatTimeStr(d.y[0]);
                        const eTime = formatTimeStr(d.y[1]);
                        return `${sTime} - ${eTime}`;
                    },
                    style: { fontSize: '11px', fontWeight: 700, colors: ['#111'] },
                    dropShadow: { enabled: false }
                },

                xaxis: { ...xAxisConfig, labels: { show: false }, tooltip: { enabled: false } },
                yaxis: { labels: { ...commonYAxis.labels, style: { fontSize: '10px', fontWeight: 400 }, formatter: commonYAxis.labels.formatter } },
                annotations: { xaxis: [ nowAnnotationLine ] },
                
                grid: { 
                    borderColor: '#444', 
                    strokeDashArray: 4, 
                    xaxis: { lines: { show: true } }, 
                    yaxis: { lines: { show: true } }, 
                    padding: { left: 0, right: 30 } 
                },
                
                tooltip: { 
                    theme: 'dark', 
                    followCursor: false, 
                    custom: function({ series, seriesIndex, dataPointIndex, w }) {
                        const d = w.globals.initialSeries[seriesIndex].data[dataPointIndex];
                        if (d.isHeader) return `<div style="display:none;"></div>`; 
                        
                        const sTime = formatTimeStr(d.y[0]);
                        const eTime = formatTimeStr(d.y[1]);
                        const sCol = d.source === 'PYDRO' ? '#eb97d8' : '#80ecf0';
                        const timeZoneLbl = useUTC ? 'UTC' : 'Local Time';
                        
                        return `<div style="padding: 10px; background: #222; border: 1px solid ${d.fillColor}; border-radius: 4px; color: #fff; font-size: 11px; line-height: 1.5; white-space: nowrap; box-shadow: 0 4px 8px rgba(0,0,0,0.5);">` +
                            `<span><b style="color:${sCol}">Source: ${d.source}</b></span><br>` +
                            `<span><b>Model Run:</b> ${d.run}</span><br>` +
                            `<span><b>Project:</b> ${d.project}</span><br>` +
                            `<span><b>Line:</b> ${d.originalLine}</span><br>` +
                            `<span><b>Datum:</b> ${d.datum}</span><br>` +
                            `<span><b>${timeZoneLbl}:</b> ${sTime} - ${eTime}</span></div>`;
                    }
                }
            };

            if (mainChart) { mainChart.destroy(); }
            if (topChart) { topChart.destroy(); }
            if (bottomChart) { bottomChart.destroy(); }

            topChart = new ApexCharts(document.querySelector("#top_axis_container"), topOptions); topChart.render();
            bottomChart = new ApexCharts(document.querySelector("#bottom_axis_container"), bottomOptions); bottomChart.render();
            
            mainChart = new ApexCharts(document.querySelector("#chart_container"), mainOptions); 
            mainChart.render().then(() => {
                setupTooltipObserver();
            });
        }

        buildUI();
    </script>
</body>
</html>
